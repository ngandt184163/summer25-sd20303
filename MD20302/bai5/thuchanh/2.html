<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .slide-top {
        -webkit-animation: slide-top 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          both;
        animation: slide-top 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }

      @keyframes moveBox {
        0% {
          left: 0;
          background: red;
        }
        50% {
          left: 100px;
          background: yellow;
        }
        100% {
          left: 0;
          background: red;
        }
      }
      .box {
        position: relative;
        width: 100px;
        height: 100px;
        animation: moveBox 3s infinite;
      }

      .shadow-drop-bl {
        -webkit-animation: shadow-drop-bl 0.4s
          cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        animation: shadow-drop-bl 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }

      /**
 * ----------------------------------------
 * animation shadow-drop-bl
 * ----------------------------------------
 */
      @-webkit-keyframes shadow-drop-bl {
        0% {
          -webkit-box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
          box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
        100% {
          -webkit-box-shadow: -12px 12px 20px -12px rgba(0, 0, 0, 0.35);
          box-shadow: -12px 12px 20px -12px rgba(0, 0, 0, 0.35);
        }
      }
      @keyframes shadow-drop-bl {
        0% {
          -webkit-box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
          box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }
        100% {
          -webkit-box-shadow: -12px 12px 20px -12px rgba(0, 0, 0, 0.35);
          box-shadow: -12px 12px 20px -12px rgba(0, 0, 0, 0.35);
        }
      }
    </style>

  <body>
    <header>
      <canvas id="canvas" width="980px" height="120px"></canvas>
      <!-- <img src="./img/logo1.png" alt=""> -->
      <script>
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        canvas.width = 980;
        canvas.height = 120;

        // Vẽ hình thang
        ctx.beginPath(); // B.đầu
        ctx.moveTo(0, 0); // Điểm b.đầu góc trên bên trái
        ctx.lineTo(205, 19); // Điểm K.thúc góc trên bên phải
        ctx.lineTo(225, 50); // Điểm K.thúc góc giữa bên phải
        ctx.lineTo(205, 85); // Điểm K.thúc góc dưới bên phải
        ctx.lineTo(0, 103); // Điểm K.thúc góc dưới bên trái
        ctx.closePath(); // K.thúc
        ctx.fillStyle = "#e64c26"; // Màu nền của hình thang
        ctx.fill();

        // Viết chữ
        // Thêm chữ HTML5
        ctx.font = "bold 50px Roboto"; // Font chữ và cỡ chữ
        ctx.fillStyle = "#fff"; // Màu chữ
        ctx.fillText("HTML5", 20, 70); // Viết chữ và vị trí chữ

        // Thêm chữ & CSS
        ctx.font = "bold 50px Roboto"; // Font chữ, cỡ chữ.
        ctx.fillStyle = "#e64c26"; // Màu chữ
        ctx.fillText("& CSS", 224, 70); // Viết chữ và vị trí để chữ
      </script>
    </header>
