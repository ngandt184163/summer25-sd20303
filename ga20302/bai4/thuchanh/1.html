<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="1.css" />
  </head>
  <body>
    <h2>bai hoc so 4</h2>
    <!-- cac the tao danh sach
     1. Danh sach khong thu tu: ul li -->
    <ul class="ds1">
      <li>san pham 1</li>
      <li>san pham 2</li>
      <li>
        Dien thoai
        <!-- danh sach long nhau -->
        <ul class="ds1-con">
          <li>Iphone</li>
          <li>Samsung</li>
          <li>Nokia</li>
        </ul>
      </li>
      <li>san pham 4</li>
    </ul>
    <!-- 2. danh sach co thu tu: ol li 
     type co 5 gia tri
     - 1: danh so tu 1
     - A: danh so tu A - Z
     - a: danh so tu a - z
     - I: danh so la ma viet hoa
     - i: danh so la ma viet thuong
     start: thay doi vi tri bat dau danh sach-->
    <ol class="ds2" type="i" start="2">
      <li>tieu de 1</li>
      <li>tieu de 2</li>
      <li>tieu de 3</li>
      <li>tieu de 4</li>
      <li>tieu de 5</li>
    </ol>

    <!-- 3. danh sach dinh nghia: dl dt dd 
     dl: the cha bao boc ben ngoai
     dt: the tieu de cua dinh nghia
     dd: the noi dung cua dinh nghia-->
    <dl>
      <dt>HTML la gi?</dt>
      <dd>HTML la ngon ngu danh dau sieu van ban.</dd>

      <dt>CSS la gi?</dt>
      <dd>CSS la ngon ngu dinh kieu cho van ban HTML</dd>
    </dl>

    <section>
      <div class="box1"></div>
      <div class="box2">
        <div class="box2__con"></div>
      </div>
      <div class="box3"></div>
    </section>
  </body>
</html>
