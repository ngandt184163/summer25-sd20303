<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="1.css" />
  </head>
  <body>
    <h2>Tim hieu ve form</h2>
    <!-- 1. form trong html la mot thanh phan de 
     thu thap du lieu tu nguoi dung va gui ve cho
     may chu xu ly. Chuc nang chinh cua form la
     tao ra cac o nhap lieu nhu van ban, nut chon,
     hop kieu, danh sach, nut bam, ... giup
     nguoi dung nhap thong tin (dang ki tai
     khoan, dang nhap, doi mat khau, dat hang,
     tim kiem) -->

    <!-- 2. cau tru cua 1 form
      - form: danh dau su bat dau ve ket thuc
      cua 1 bieu mau
      - input(10 loai input co ban): tao dieu
      khien textbox, checkbox, nut bam
      - textarea: tao dieu khien textbox tren
      nhieu dong 
      - select: tao dieu khien danh sach
      - nut gui du lieu: thuong la the input hoac
      the button co kieu la submit-->
    <!-- 3 thuoc tinh cua the form
       1. action: chi dinh noi ma du lieu
       se duoc xu li sau khi bam gui form
       2. methhod: phuong thuc gui du lieu:
       get,post 
       3. enctype: can thiet de gui du lieu
       dang file-->
    <form action="" method="get" enctype="multipart/form-data">
      <!-- hien thi dieu khien van ban(nhap tren 1 dong) -->
      nhap ten: <input type="text" name="hoten" /><br />
      <!-- hien thi dieu khien nhap mat khau -->
      nhap mat khau: <input type="password" name="mk" /><br />
      <!-- hien thi dieu khien chon file -->
      avatar: <input multiple type="file" name="avatar" /><br />
      <!-- hien thi dieu khien checkbox: chon nhieu
       dap an -->
      so thich: boi loi
      <input type="checkbox" name="sothich" value="boiloi" /> choi dan:
      <input type="checkbox" name="sothich" value="choidan" /> bong da:
      <input type="checkbox" name="sothich" value="bongda" /> du lich:
      <input type="checkbox" name="sothich" value="dulich" /><br />

      <!-- hien thi radio: chon 1 dap an trong 
       1 ds -->
      gioi tinh: nam: <input type="radio" name="giotinh" value="nam" /> nu:
      <input type="radio" name="giotinh" value="nu" /><br />

      <!-- dieu khien hidden: an 1 the input -->
      <input type="hidden" name="id-sp" value="ga001" />

      gioi thieu ban than:
      <textarea cols="30" rows="10" name="gioithieu"></textarea> <br />
      que quan:
      <select name="quequan">
        <option value="">-- chon que quan --"></option>
        <option value="hanoi">ha noi</option>
        <option value="hanam">ha nam</option>
        <option value="namdinh">nam dinh</option></select
      ><br />
      <!-- nut gui du lieu -->
      <input type="submit" value="Gui du lieu" name="submit" />
      <!-- nut lam sach du lieu khi muon nhap lai -->
      <input type="reset" name="reset" value="nhap lai" />
    </form>
  </body>
</html>
