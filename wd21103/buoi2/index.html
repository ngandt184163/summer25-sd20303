<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- dau cua 1 trang -->
    <header>
      <div class="header__logo">
        <img class="header__logo__img" src="logo1.png" alt="" />
      </div>
    </header>
    <!-- thanh dieu huong -->
    <nav>
      <ul class="nav__menu">
        <li class="nav__menu__item"><a href="">Home</a></li>
        <li class="nav__menu__item"><a href="">About</a></li>
        <li class="nav__menu__item"><a href="">Contact</a></li>
        <li class="nav__menu__item"><a href="">Service</a></li>
        <li class="nav__menu__item"><a href="">Product</a></li>
      </ul>
      <!-- noi dung trang web -->
      <main>
        <!-- noi dung chinh -->
        <article>
          <!-- noi dung 1 khoi/ 1 phan -->
          <section class="drag-drop">
            <div id="drag" draggable="true">keo toi</div>
            <div id="drop">tha vao day</div>
          </section>
          <section class="storage">
            <button onclick="saveData()">luu</button>
            <button onclick="showData()">hien thi</button>
            <button onclick="clearData()">xoa du lieu</button>
          </section>

          <section class="geolocation">
            <button onclick="getLocation()">lay vi tri hien tai</button>
            <p id="vitri"></p>
          </section>
        </article>
        <!-- noi dung phu/ quang cao -->
        <aside>
          <div class="ads__photo">
            <img class="ads__photo__img" src="register_03.jpg" alt="" />
          </div>
        </aside>
      </main>

      <!-- phan chan trang -->
      <footer>Dinh Thi Ngan</footer>
    </nav>
    <script src="main.js"></script>
  </body>
</html>
