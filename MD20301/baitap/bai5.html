<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    //Bui tat Bac
    <input id="txt" />
    <button onclick="kt()">kiem tra</button>
    <p id="kq"></p>
    <script>
      function kt() {
        let s = document
          .getElementById("txt")
          .value.toLowerCase()
          .replace(/\s/g, "");
        let rs = s.split("").reverse().join("");
        document.getElementById("kq").innerText =
          s === rs ? "ddung la palindrome" : "khong phai la palindrome";
      }
    </script>
  </body>
</html>
