    <script>
      class Student {
        constructor(name, age) {
          this.name = name;
          this.age = age;
        }
        getInfo() {
          return {
            name: this.name,
            age: this.age,
          };
        }
      }

      let s1 = new Student("Hieu", 19);
      console.log(s1.getInfo());
    </script>
