<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <h1>buoi10</h1>
    <script>
      /**
       * 1. OPP nang cao
       * 1.1: ham geter va seter
       * - geter: la phuong thuc lay gia tri cua thuoc tinh
       * - setter: la phuong thuc gan gia tri cho thuoc tinh
       * (co kiem tra truoc khi gan gia tri cho thuoc tinh)
       * 1.2. static: la phuong thuc thuoc class, chu khong
       * thuoc doi tuong, khi sd chung ta sd no voi class,
       * chu khong sd qua doi tuong
       * - sd khi no la 1 ham tien ich, hoac 1 gia tri dung
       * chung, hoac muon sd khi khong can tao doi tuong
       *
       * 1.3. doi tuong long trong doi tuong.
       */
      // tao doi tuong Student co thuoc tinh diem
      class Student {
        // score;
        constructor(score) {
          this._score = score;
        }

        // ham getter lay gia tri cua score
        get score() {
          return this._score;
        }
        // ham setter gan gia tri cho score
        set score(score) {
          if (score < 0) {
            console.log("diem khong hop le");
          } else {
            this._score = score;
          }
        }
      }

      let student1 = new Student(8);
      student1.score = 9;
      console.log(student1.score);
      student1.score = -5;
      console.log(student1.score);

      // tao class chua ham cong 2 so: ham nay la ham tien ich
      class Caculator {
        static sum(a, b) {
          return a + b;
        }
      }
      //   cac sd dung: sd ma k can tao doi tuong
      let sum = Caculator.sum(1, 2);
      console.log(sum);
      // cach sd sai
      //   let abc = new Caculator();
      //   console.log(abc.sum(1, 2));

      // chua bai tap so 9
      class Student2 {
        static count = 0; // gia tri dung chung, ban dau chua co sv nao
        constructor(name) {
          this.name = name;
          // khi tao doi tuong moi count tang len 1
          Student2.count++;
        }
      }

      let std1 = new Student2("Nguyen Van A");
      let std2 = new Student2("Nguyen Van B");
      let std3 = new Student2("Nguyen Van C");
      console.log(Student2.count);

      class Address {
        constructor(street, city, country) {
          this.street = street;
          this.city = city;
          this.country = country;
        }
      }
      class Student3 {
        constructor(name, address, hobi) {
          this.name = name;
          this.address = address;
          this.hobi = hobi;
        }
      }

      let address1 = new Address("Le Hong Phong", "Hai Phong", "Viet Nam");
      let address2 = new Address("Pham Hung", "Ha Noi", "Viet Nam");
      let std4 = new Student3("Dinh Thi Duyen", address1, [
        "xem phim",
        "hoc ngoai ngu",
      ]);
      let std5 = new Student3("Nguyen Huu Hieu", address2, [
        "chay bo",
        "leo nui",
      ]);
      console.log(std4, std5);
    </script>
