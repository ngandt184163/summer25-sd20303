    <script>

      class Rectangle {
        constructor(width, height) {
          this.width = width;
          this.height = height;
        }
        getArea() {
          return this.width * this.height;
        }
      }
      let hcn = new Rectangle(5, 10);
      console.log(hcn.getArea()); //50
    </script>
